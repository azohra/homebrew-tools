
[tools]
ruby = "4.0"

[tool_config]
locked = true

[tasks."check:orca-api"]
description = "The published orca API metadata still matches the cask"
run = """
#!/usr/bin/env bash
set -euo pipefail
git diff --quiet || { echo "check:orca-api: refusing — tracked changes are not staged" >&2; exit 1; }
./scripts/orca-api-json.sh
git diff --exit-code api/cask/orca.json
"""

[tasks.check]
description = "Ruby syntax and brew style for every formula and cask, against the staged tree"
depends = ["check:orca-api"]
run = """
#!/usr/bin/env bash
# `brew tap <path>` always `git clone`s — it sees committed history, never
# the working tree or index. A tap from this checkout's path would silently
# grade the previous commit while a new one sits staged. Export the exact
# staged tree into a throwaway repo and tap that instead, so pre-commit
# proves what is about to land, not what already did.
set -euo pipefail
command -v brew >/dev/null || { echo "check: refusing — Homebrew is not installed" >&2; exit 1; }
for f in *.rb Casks/*.rb; do
  [ -f "$f" ] || continue
  ruby -c "$f"
done
# A pre-commit hook runs with GIT_INDEX_FILE (and, in other contexts, GIT_DIR
# and GIT_WORK_TREE) exported pointing at THIS checkout's real state; any
# child git command that doesn't clear them operates on it instead of the
# throwaway repo below, corrupting or confusing the real one.
unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR GIT_OBJECT_DIRECTORY GIT_PREFIX
# The throwaway tap is materialized straight into Library/Taps and removed
# with rm -rf — NEVER via `brew tap`/`brew untap`. brew attributes installed
# casks to any tap carrying their token, so `brew untap` refuses and
# `brew untap --force` UNINSTALLS the user's real apps. Touching the real
# azohra/tools tap here is equally forbidden: real machines install from it.
taproot="$(brew --repository)/Library/Taps/azohra-check"
tapdir="$taproot/homebrew-tools-check"
trap 'rm -rf "$taproot"' EXIT
rm -rf "$taproot"
mkdir -p "$tapdir"
git checkout-index -a --prefix="$tapdir/"
git -C "$tapdir" init -q
git -C "$tapdir" add -A
git -C "$tapdir" -c user.email=check@local -c user.name=check commit -q -m staged
for f in *.rb; do
  [ -f "$f" ] || continue
  brew style --formula "azohra-check/tools-check/$(basename "$f" .rb)"
done
for f in Casks/*.rb; do
  [ -f "$f" ] || continue
  brew style --cask "azohra-check/tools-check/$(basename "$f" .rb)"
done
echo "check: every formula and cask is well-formed"
"""

[tasks."check:install-formulas"]
description = "Install and test every formula from the staged tree"
run = "./scripts/check-install.sh formulas"

[tasks."check:install-gopro-yank"]
description = "Install GoPro Yank from the staged cask and print its version"
run = "./scripts/check-install.sh cask gopro-yank"

[tasks."check:install-orca"]
description = "Install Orca from the staged cask and print its version"
run = "./scripts/check-install.sh cask orca"

# The version bump is a reviewed edit; these fetch upstream's release and
# rewrite the cask so the bump is the same act locally and on the cron.
[tasks."update:orca"]
description = "Rewrite the orca cask and its API metadata from upstream's latest release"
run = "./scripts/update-orca.sh"

[tasks."update:gopro-yank"]
description = "Rewrite the gopro-yank cask for a released version"
raw_args = true
run = "./scripts/update-gopro-yank.sh"
