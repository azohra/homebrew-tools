
[tools]
python = "3.14"
gh = "2.100.0"
jq = "1.8.1"
ruby = "4.0"
"http:brew" = { version = "6.0.20", url = "https://github.com/Homebrew/brew/archive/refs/tags/{{ version }}.tar.gz", checksum = "blake3:5190087c39c349285282d7a07a6fe41504d398950b45a99b113a0ad17050fa9c" }

[env]
HOMEBREW_FORCE_VENDOR_RUBY = "1"
HOMEBREW_NO_AUTO_UPDATE = "1"

[tasks.test]
description = "Test package updates without publication"
run = "python -m unittest discover -s tests -v"

[tasks."check:orca-api"]
description = "The published orca API metadata still matches the cask"
run = """
#!/usr/bin/env bash
set -euo pipefail
git diff --quiet || { echo "check:orca-api: refusing — tracked changes are not staged" >&2; exit 1; }
./scripts/orca-api-json.sh
git diff --exit-code api/cask/orca.json
"""

[tasks.check]
description = "Check updater behavior and Homebrew package syntax and style"
depends = ["test"]
run = """
#!/usr/bin/env bash
set -euo pipefail
for file in *.rb Casks/*.rb; do
  ruby -c "$file"
done
tapdir="$(brew --repository)/Library/Taps/azohra-check/homebrew-tools-check"
[ ! -e "$tapdir" ] || { echo "check: temporary tap already exists" >&2; exit 1; }
trap 'rm -rf "$tapdir"' EXIT
mkdir -p "$tapdir/Casks"
cp ./*.rb "$tapdir/"
cp Casks/*.rb "$tapdir/Casks/"
brew style --formula "$tapdir/"*.rb
brew style --cask "$tapdir/Casks/"*.rb
"""

[tasks."check:install-formulas"]
description = "Install and test every formula from the staged tree"
run = "./scripts/check-install.sh formulas"

[tasks."check:install-gopro-yank"]
description = "Install GoPro Yank from the staged cask and print its version"
run = "./scripts/check-install.sh cask gopro-yank"

[tasks."check:install-orca"]
description = "Install Orca from the staged cask and print its version"
run = "./scripts/check-install.sh cask orca"

# Update tasks edit local package files. CI opens the resulting pull request.
[tasks."update:orca"]
description = "Rewrite the orca cask and its API metadata from upstream's latest release"
run = "./scripts/update-orca.sh"

[tasks."update:gopro-yank"]
description = "Rewrite the gopro-yank cask for a released version"
raw_args = true
run = "./scripts/update-gopro-yank.sh"

[tasks."update:ysh"]
description = "Update the YAML.sh formula from verified published bytes"
raw_args = true
run = "./scripts/update-ysh.sh"
