
[tools]
python = "3.14"
ruby = "4.0"
"http:brew" = { version = "6.0.20", url = "https://github.com/Homebrew/brew/archive/refs/tags/{{ version }}.tar.gz", checksum = "blake3:5190087c39c349285282d7a07a6fe41504d398950b45a99b113a0ad17050fa9c" }

[env]
HOMEBREW_FORCE_VENDOR_RUBY = "1"
HOMEBREW_NO_AUTO_UPDATE = "1"

[tasks.lint]
description = "Ruby syntax and brew style for every formula and cask, on an isolated copy"
# The temporary tap lives in the one Homebrew every worktree shares.
lock = true
run = """
#!/usr/bin/env bash
set -euo pipefail
for file in *.rb Casks/*.rb; do
  ruby -c "$file"
done
tapdir="$(brew --repository)/Library/Taps/azohra-check/homebrew-tools-check"
[ ! -e "$tapdir" ] || { echo "lint: temporary tap already exists" >&2; exit 1; }
trap 'rm -rf "$tapdir"' EXIT
mkdir -p "$tapdir/Casks"
cp ./*.rb "$tapdir/"
cp Casks/*.rb "$tapdir/Casks/"
brew style --formula "$tapdir/"*.rb
brew style --cask "$tapdir/Casks/"*.rb
"""

[tasks."check:tasks"]
description = "Every task definition is valid"
run = "mise tasks validate"

[tasks.check]
description = "The definition of green"
depends = ["check:tasks", "lint"]

[tasks."check:install-formulas"]
description = "Install and test every formula from the staged tree"
# Both install proofs stage the same tap in the one Homebrew every worktree shares.
lock = "homebrew-tools-install"
run = "./scripts/check-install.sh formulas"

[tasks."check:install-cask"]
description = "Install a staged cask and print its version"
lock = "homebrew-tools-install"
raw_args = true
run = "./scripts/check-install.sh cask"
