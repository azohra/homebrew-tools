name: Update GoPro Yank

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, such as 1.0.1; leave blank for latest
        required: false
        type: string
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    environment: automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Bosun app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.BOSUN_CLIENT_ID }}
          private-key: ${{ secrets.BOSUN_PRIVATE_KEY }}
          owner: azohra
          repositories: homebrew-tools
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - name: Update cask
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mise run update:gopro-yank "${{ inputs.version }}"
