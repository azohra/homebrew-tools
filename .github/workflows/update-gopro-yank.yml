name: Update GoPro Yank

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, such as 1.0.1; leave blank for latest
        required: false
        type: string
  schedule:
    - cron: "17 7 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          minimum_release_age: 24h
      - name: Update cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run update:gopro-yank "${{ inputs.version }}"
