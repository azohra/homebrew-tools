name: Update GoPro Yank

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, such as 1.0.1; leave blank for latest
        required: false
        type: string
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-gopro-yank.sh "${{ inputs.version }}"
