name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formulas:
    name: Formulae
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      orca: ${{ steps.changed.outputs.orca }}
      gopro: ${{ steps.changed.outputs.gopro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for package in orca gopro; do
            token=$package
            [ "$package" != gopro ] || token=gopro-yank
            if [ -z "$BASE_SHA" ] || ! git diff --quiet "$BASE_SHA" HEAD -- "Casks/$token.rb" api/cask/orca.json mise.toml scripts .github/workflows/check.yml; then
              echo "$package=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - run: mise run check
      - name: Install and test every formula
        run: mise run check:install-formulas

  orca:
    needs: formulas
    if: needs.formulas.outputs.orca == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - run: mise run check:orca-api
      - run: mise run check:install-orca

  gopro:
    needs: formulas
    if: needs.formulas.outputs.gopro == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - run: mise run check:install-gopro-yank

  required:
    name: Check
    if: always()
    needs: [formulas, orca, gopro]
    runs-on: ubuntu-latest
    steps:
      - env:
          FORMULAS: ${{ needs.formulas.result }}
          ORCA: ${{ needs.orca.result }}
          GOPRO: ${{ needs.gopro.result }}
        run: |
          [ "$FORMULAS" = success ]
          [ "$ORCA" = success ] || [ "$ORCA" = skipped ]
          [ "$GOPRO" = success ] || [ "$GOPRO" = skipped ]
