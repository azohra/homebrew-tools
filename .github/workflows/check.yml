name: Check

# The cask workflows install Orca and GoPro Yank when their files change. This
# workflow checks the whole tap and installs every formula.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run check
      - name: Install and test every formula
        run: mise run check:install-formulas
