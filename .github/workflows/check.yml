name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formulas:
    name: Formulae
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      casks: ${{ steps.changed.outputs.casks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          matrix = []
          base = os.environ['BASE_SHA']
          for package in ('orca', 'gopro-yank', 'config', 'op-agent'):
              paths = [f'Casks/{package}.rb', 'mise.toml', 'scripts', '.github/workflows/check.yml']
              if package == 'orca':
                  paths.append('api/cask/orca.json')
              if not base or subprocess.run(['git', 'diff', '--quiet', base, 'HEAD', '--', *paths]).returncode:
                  matrix.append({'package': package, 'os': 'macos-latest'})
                  if package == 'op-agent':
                      matrix.append({'package': package, 'os': 'ubuntu-latest'})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('casks=' + json.dumps(matrix) + '\n')
          PY
      - run: mise run check
      - name: Install and test every formula
        run: mise run check:install-formulas

  casks:
    name: ${{ matrix.package }} (${{ matrix.os }})
    needs: formulas
    if: needs.formulas.outputs.casks != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.formulas.outputs.casks) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - if: matrix.package == 'orca'
        run: mise run check:orca-api
      - env:
          PACKAGE: ${{ matrix.package }}
        run: mise run check:install-cask -- "$PACKAGE"

  required:
    name: Check
    if: always()
    needs: [formulas, casks]
    runs-on: ubuntu-latest
    steps:
      - env:
          FORMULAS: ${{ needs.formulas.result }}
          CASKS: ${{ needs.casks.result }}
        run: |
          [ "$FORMULAS" = success ]
          [ "$CASKS" = success ] || [ "$CASKS" = skipped ]
