name: Check

# The cask workflows install Orca and GoPro Yank when their files change. This
# workflow checks the whole tap and installs every formula.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # brew is preinstalled but off PATH on the Ubuntu runners, and the tap
    # installs casks, which are macOS-only.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise run check
      - name: Install and test every formula
        run: |
          set -euo pipefail
          brew tap azohra/tools "$GITHUB_WORKSPACE"
          for formula in *.rb; do
            token=${formula%.rb}
            brew install --formula "azohra/tools/$token"
            brew test "azohra/tools/$token"
          done
