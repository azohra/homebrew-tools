name: Install GoPro Yank

on:
  push:
    branches:
      - main
    paths:
      - "Casks/gopro-yank.rb"
      - ".github/workflows/install-gopro-yank.yml"
      - ".github/workflows/update-gopro-yank.yml"
      - "mise.toml"
      - "scripts/check-install.sh"
      - "scripts/update-gopro-yank.sh"
  pull_request:
    paths:
      - "Casks/gopro-yank.rb"
      - ".github/workflows/install-gopro-yank.yml"
      - ".github/workflows/update-gopro-yank.yml"
      - "mise.toml"
      - "scripts/check-install.sh"
      - "scripts/update-gopro-yank.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - run: mise run check:install-gopro-yank
