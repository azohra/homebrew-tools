name: Install GoPro Yank

on:
  push:
    branches:
      - main
    paths:
      - "Casks/gopro-yank.rb"
      - ".github/workflows/install-gopro-yank.yml"
      - ".github/workflows/update-gopro-yank.yml"
      - "mise.toml"
      - "scripts/check-install.sh"
      - "scripts/update-gopro-yank.sh"
  pull_request:
    paths:
      - "Casks/gopro-yank.rb"
      - ".github/workflows/install-gopro-yank.yml"
      - ".github/workflows/update-gopro-yank.yml"
      - "mise.toml"
      - "scripts/check-install.sh"
      - "scripts/update-gopro-yank.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise run check:install-gopro-yank
