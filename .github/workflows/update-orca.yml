name: Update Orca

on:
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update cask and API metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-orca.sh
