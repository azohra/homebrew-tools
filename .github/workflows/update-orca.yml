name: Update Orca

on:
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - name: Update cask and API metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run update:orca
