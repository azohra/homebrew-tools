name: Install Orca

on:
  push:
    branches:
      - main
    paths:
      - "Casks/orca.rb"
      - "api/cask/orca.json"
      - ".github/workflows/install-orca.yml"
      - ".github/workflows/update-orca.yml"
      - "mise.toml"
      - "scripts/check-install.sh"
      - "scripts/orca-api-json.sh"
      - "scripts/update-orca.sh"
  pull_request:
    paths:
      - "Casks/orca.rb"
      - "api/cask/orca.json"
      - ".github/workflows/install-orca.yml"
      - ".github/workflows/update-orca.yml"
      - "mise.toml"
      - "scripts/check-install.sh"
      - "scripts/orca-api-json.sh"
      - "scripts/update-orca.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          minimum_release_age: 24h
      - name: Check generated cask metadata
        run: mise run check:orca-api
      - run: mise run check:install-orca
