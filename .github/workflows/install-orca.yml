name: Install Orca

on:
  push:
    branches:
      - main
    paths:
      - "Casks/orca.rb"
      - "api/cask/orca.json"
      - ".github/workflows/install-orca.yml"
      - ".github/workflows/update-orca.yml"
      - "mise.toml"
      - "scripts/check-install.sh"
      - "scripts/orca-api-json.sh"
      - "scripts/update-orca.sh"
  pull_request:
    paths:
      - "Casks/orca.rb"
      - "api/cask/orca.json"
      - ".github/workflows/install-orca.yml"
      - ".github/workflows/update-orca.yml"
      - "mise.toml"
      - "scripts/check-install.sh"
      - "scripts/orca-api-json.sh"
      - "scripts/update-orca.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise run check:install-orca
