name: Install Orca

on:
  push:
    branches:
      - main
    paths:
      - "Casks/orca.rb"
      - "api/cask/orca.json"
      - ".github/workflows/install-orca.yml"
      - ".github/workflows/update-orca.yml"
      - "scripts/orca-api-json.sh"
      - "scripts/update-orca.sh"
  pull_request:
    paths:
      - "Casks/orca.rb"
      - "api/cask/orca.json"
      - ".github/workflows/install-orca.yml"
      - ".github/workflows/update-orca.yml"
      - "scripts/orca-api-json.sh"
      - "scripts/update-orca.sh"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: brew tap azohra/tools "$GITHUB_WORKSPACE"
      - run: brew install --cask azohra/tools/orca
      - run: orca --version
